<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookly Support</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="disclosure-banner">
    Independent prototype built by <strong>Akshay Koul</strong> for a Decagon Solutions
    Engineering interview &mdash; not an official Decagon product.
  </div>

  <div id="gate" class="gate">
    <div class="gate-card">
      <h2>📚 Bookly Support</h2>
      <p>This demo is access-gated. Enter the code you were given.</p>
      <form id="gateForm">
        <input type="password" id="gateInput" placeholder="Access code" autocomplete="off">
        <button type="submit">Enter</button>
      </form>
      <p id="gateError" class="gate-error"></p>
    </div>
  </div>

  <div class="app" id="app" hidden>
    <header>
      <h1>📚 Bookly Support</h1>
      <label class="voice-toggle">
        <input type="checkbox" id="voiceToggle">
        Speak responses
      </label>
    </header>

    <div id="messages" class="messages"></div>

    <form id="chatForm" class="input-row">
      <button type="button" id="micBtn" title="Speak your message">🎤</button>
      <input type="text" id="messageInput" placeholder="Ask about an order, a return, shipping..." autocomplete="off">
      <button type="submit">Send</button>
    </form>

    <p class="trace-link">
      Session: <code id="sessionIdLabel">(new)</code>
      &middot; <a id="traceLink" href="#" target="_blank">view trace</a>
    </p>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
